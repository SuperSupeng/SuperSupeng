<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Darren Su — AI products, open source, and the China AI ecosystem</title>
  <desc id="desc">Editorial profile banner for Darren Su, also known as SuperSupeng and 苏鹏. Datawhale City Lead, AGI Villa co-founder, and builder of MatchPoint.</desc>

  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff93c5"/>
      <stop offset="0.58" stop-color="#f27fb7"/>
      <stop offset="1" stop-color="#e96aa8"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7f229"/>
      <stop offset="1" stop-color="#c9d91f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff8e7" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="8" dy="9" stdDeviation="0" flood-color="#090909"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="canvas">
      <rect x="10" y="10" width="1180" height="500" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#090909"/>
  <rect x="10" y="10" width="1180" height="500" rx="22" fill="url(#pink)"/>
  <g clip-path="url(#canvas)">
    <rect x="10" y="10" width="1180" height="500" fill="url(#grid)"/>
    <circle cx="1085" cy="112" r="210" fill="#fff3d6" opacity="0.10"/>
    <circle cx="927" cy="419" r="260" fill="#e7f229" opacity="0.08"/>
    <path d="M711 514L1190 240M790 514L1190 302M874 514L1190 365M963 514L1190 427" fill="none" stroke="#fff8e7" stroke-opacity="0.32" stroke-width="1.5"/>
    <path d="M760 514L760 475M840 514L840 429M920 514L920 383M1000 514L1000 337M1080 514L1080 291M1160 514L1160 245" fill="none" stroke="#fff8e7" stroke-opacity="0.26" stroke-width="1.5"/>
  </g>

  <g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#090909">
    <g filter="url(#shadow)">
      <rect x="48" y="42" width="525" height="49" rx="9" fill="url(#acid)" stroke="#090909" stroke-width="4"/>
      <text x="67" y="74" font-size="18" font-weight="900" letter-spacing="1.15">DATAWHALE CITY LEAD · AGI VILLA CO-FOUNDER</text>
    </g>

    <g>
      <rect x="1009" y="43" width="133" height="47" rx="23.5" fill="#fff3d6" stroke="#090909" stroke-width="4"/>
      <circle cx="1032" cy="66.5" r="5" fill="#e7f229" stroke="#090909" stroke-width="2"/>
      <text x="1047" y="73" font-size="16" font-weight="900" letter-spacing="0.8">SHANGHAI</text>
    </g>

    <text x="48" y="203" font-size="98" font-weight="950" letter-spacing="-5">DARREN SU</text>
    <text x="52" y="245" font-size="24" font-weight="900" letter-spacing="2.2">苏鹏 / SUPERSUPENG</text>

    <rect x="48" y="277" width="621" height="5" rx="2.5" fill="#090909"/>
    <text x="48" y="326" font-size="29" font-weight="950" letter-spacing="0.2">AI PRODUCTS × OPEN SOURCE</text>
    <text x="48" y="365" font-size="29" font-weight="950" letter-spacing="0.2">× CHINA ECOSYSTEM</text>

    <g transform="translate(48 405)">
      <rect width="590" height="66" rx="12" fill="#fff3d6" stroke="#090909" stroke-width="4"/>
      <text x="22" y="28" font-size="13" font-weight="900" letter-spacing="1.6">OPERATING PRINCIPLE</text>
      <text x="22" y="51" font-size="19" font-weight="850">Build products. Connect builders. Learn in public.</text>
      <path d="M554 23H570M562 15L570 23L562 31" fill="none" stroke="#090909" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(751 113)">
      <text x="0" y="0" font-size="14" font-weight="900" letter-spacing="2">BUILDER NETWORK / 04 NODES</text>

      <path d="M64 98L180 45L318 106L242 226L93 213L64 98Z" fill="none" stroke="#090909" stroke-width="3"/>
      <path d="M64 98L242 226M180 45L93 213M180 45L242 226M64 98L318 106M93 213L318 106" fill="none" stroke="#090909" stroke-opacity="0.5" stroke-width="2"/>

      <circle cx="64" cy="98" r="32" fill="#e7f229" opacity="0.24" filter="url(#softGlow)"/>
      <circle cx="64" cy="98" r="12" fill="#e7f229" stroke="#090909" stroke-width="4"/>
      <circle cx="180" cy="45" r="10" fill="#fff3d6" stroke="#090909" stroke-width="4"/>
      <circle cx="318" cy="106" r="10" fill="#e7f229" stroke="#090909" stroke-width="4"/>
      <circle cx="242" cy="226" r="10" fill="#fff3d6" stroke="#090909" stroke-width="4"/>
      <circle cx="93" cy="213" r="10" fill="#e7f229" stroke="#090909" stroke-width="4"/>

      <g font-size="12" font-weight="950" letter-spacing="0.7">
        <rect x="8" y="61" width="112" height="25" rx="5" fill="#090909"/>
        <text x="20" y="79" fill="#fff3d6">DATAWHALE</text>
        <text x="151" y="20">BUILDERS</text>
        <text x="325" y="111">MATCHPOINT</text>
        <text x="224" y="253">AGI VILLA</text>
        <text x="29" y="243">FIELD NOTES</text>
      </g>

      <circle cx="152" cy="104" r="5" fill="#090909">
        <animate attributeName="cx" values="64;318;242;93;64" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="98;106;226;213;98" dur="7s" repeatCount="indefinite"/>
      </circle>

      <g transform="translate(18 281)">
        <rect width="341" height="62" rx="11" fill="#090909"/>
        <text x="17" y="25" fill="#ff93c5" font-size="12" font-weight="900" letter-spacing="1.5">CURRENT SIGNAL</text>
        <text x="17" y="47" fill="#fff3d6" font-size="17" font-weight="850">Products that move people forward.</text>
        <circle cx="319" cy="31" r="9" fill="#e7f229"/>
      </g>
    </g>
  </g>
</svg>
